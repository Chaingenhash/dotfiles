# Extra autostart processes
# exec-once = uwsm-app -- my-service

# --- Session restore ---
# Startup layout lives in session.conf, generated by `hypr-session-save`.
# To save the current window layout as the new boot layout, run:
#   hypr-session-save
# Launch commands per window class: ~/.config/hypr/session-apps.conf
# Rules apply at spawn only — move windows/workspaces freely after start.
source = ~/.config/hypr/session.conf
