# Class → launch command map for hypr-session-save.
# Format: window class = command to launch it
# Find a window's class with: hyprctl clients | grep class
# Lines starting with # and blank lines are ignored.

firefox-default = firefox -p default-release --name firefox-default
firefox-work = firefox -p Work --name firefox-work
antigravity-ide = antigravity-ide
com.mitchellh.ghostty = ghostty --working-directory=$HOME/Documents/CMS/
chrome-web.whatsapp.com__-Default = omarchy-launch-webapp https://web.whatsapp.com/
