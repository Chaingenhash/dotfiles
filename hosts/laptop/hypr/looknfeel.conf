# Change the default Omarchy look'n'feel

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    # No gaps between windows or borders
    gaps_in = 0
    gaps_out = 0
    border_size = 0

    # Change to niri-like side-scrolling layout
    # layout = scrolling
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    # Use round window corners
    # rounding = 8

    # Dim unfocused windows (0.0 = no dim, 1.0 = fully dimmed)
    # dim_inactive = true
    # dim_strength = 0.15
}

# Override default opacity: focused windows fully opaque (default was 0.97)
windowrule = opacity 1.0 0.9, match:tag default-opacity
windowrule = opacity 1.0 0.9, match:tag terminal

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    # Disable all animations
    # enabled = no
}

# https://wiki.hypr.land/Configuring/Variables/#layout
layout {
    # Avoid overly wide single-window layouts on wide screens
    # single_window_aspect_ratio = 1 1
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    # Adaptive sync: let the display drop below its fixed refresh when nothing on
    # screen changes, instead of repainting every frame regardless. Cuts idle iGPU
    # work. 1 = on everywhere; use 2 (fullscreen only) if the eDP panel flickers.
    vrr = 1
}
